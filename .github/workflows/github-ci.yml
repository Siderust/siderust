name: Siderust CI

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: write
  pull-requests: write   # needed to post PR comments

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Deterministic CI: do not download multi-GB JPL BSP files during --all-features.
  SIDERUST_JPL_STUB: all
  # Regular CI should cover library, binaries, examples, and tests without compiling
  # Criterion benchmark targets. The benchmark job checks those separately.
  CARGO_CI_TARGETS: "--lib --bins --tests --examples"

jobs:
  check:
    name: Check (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace $CARGO_CI_TARGETS --all-features

  benchmarks:
    name: Benchmark integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked -p siderust --benches --features bench-internals,embedded-compact

  docs:
    name: Markdown and Rustdoc (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --locked -p siderust-release --bin check-doc-links
      - name: Build API docs with docs.rs features and strict links
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::invalid_html_tags"
        run: cargo doc -p siderust --all-features --no-deps

  check-no-default-features:
    name: Check (no_std + alloc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo check --locked -p siderust --lib --target thumbv7em-none-eabihf --no-default-features --features embedded-compact
      - name: Verify compact Archive feature isolation
        run: |
          cargo tree --locked -p siderust --no-default-features --features embedded-compact -e features -i siderust-archive > archive-features.txt
          cat archive-features.txt
          # Archive 0.2.0 provides the required IAU 2000B tables via `nutation`.
          if grep -E 'siderust-archive feature "(vsop|elp|fetch|std)"' archive-features.txt; then
            exit 1
          fi
      - run: cargo test --locked -p siderust --test compact_ephemeris --no-default-features --features embedded-compact
      - run: cargo check -p siderust --lib --no-default-features --features full-ephemeris,full-nutation
      - run: cargo check -p siderust --lib --no-default-features --features full-ephemeris,full-nutation,serde
      - run: cargo check -p siderust --lib --target thumbv7em-none-eabihf --no-default-features --features full-ephemeris,full-nutation
      - run: cargo check -p siderust --lib --target thumbv7em-none-eabihf --no-default-features --features full-ephemeris,full-nutation,serde
      - run: cargo check -p siderust --lib --no-default-features --features full-ephemeris,full-nutation,atmosphere
      - run: cargo check -p siderust --lib --no-default-features --features full-ephemeris,full-nutation,atmosphere,serde
      - run: cargo check -p siderust --lib --target thumbv7em-none-eabihf --no-default-features --features full-ephemeris,full-nutation,atmosphere
      - run: cargo check -p siderust --lib --target thumbv7em-none-eabihf --no-default-features --features full-ephemeris,full-nutation,atmosphere,serde
      - run: cargo test -p siderust --test observatory_catalog_no_default --no-default-features --features full-ephemeris,full-nutation,std

  release-preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p siderust-release
      - run: cargo run --locked -p siderust-release -- validate

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path scripts/compact-esp32/Cargo.toml -- --check

  clippy:
    name: Clippy (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace $CARGO_CI_TARGETS --all-features -- -D warnings

  test:
    name: Test (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace $CARGO_CI_TARGETS --all-features
      - run: cargo test --doc --workspace --all-features

  test-pod:
    name: Test (pod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --features pod

  test-spice:
    name: Test (spice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --features spice

  test-runtime-data:
    name: Test (runtime-data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --features runtime-data

  test-pod-parquet:
    name: Test (pod-parquet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --features pod-parquet

  test-pod-doris:
    name: Test (pod-doris)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --features pod-doris

  coverage:
    name: Test & Coverage
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    env:
      SIDERUST_JPL_STUB: all

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust (nightly + llvm-tools)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Clean previous coverage data
        run: |
          cargo +nightly llvm-cov clean --workspace
          rm -rf target/llvm-cov-target/*.profraw

      - name: Coverage (run, no report)
        run: cargo +nightly llvm-cov --workspace --all-features --doctests --no-report

      - name: Coverage (Cobertura XML)
        run: cargo +nightly llvm-cov report --cobertura --output-path coverage.xml

      - name: Coverage (HTML)
        run: cargo +nightly llvm-cov report --html --output-dir coverage_html

      - name: Build coverage summary (Markdown)
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          output: file

      - name: Publish to Job Summary
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage as PR comment
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v2
        with:
          message-path: code-coverage-results.md
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Coverage gate (≥90% lines)
        run: cargo +nightly llvm-cov --workspace --all-features --doctests --no-run --fail-under-lines 90

      - name: Strict phase table coverage (≥95% lines)
        run: |
          cargo +nightly llvm-cov report --json --output-path phase-coverage.json
          jq -er '
            [.data[0].files[] | select(.filename | endswith("/src/atmosphere/normalized_phase.rs"))]
            | if length == 1 then .[0].summary.lines.percent
              else error("Expected one normalized_phase.rs entry")
              end
            | "Strict phase table line coverage: \(.)%",
              (if . >= 95 then true else error("Strict phase table coverage is below 95%") end)
          ' phase-coverage.json

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage_html
          retention-days: 7

      - name: Starlight production coverage (≥90% lines)
        run: |
          jq -er '
            [.data[0].files[]
              | (.filename | gsub("\\\\"; "/")) as $path
              | select(($path | contains("/src/starlight/"))
                and ($path | contains("/src/starlight/tests/") | not)
                and ($path | endswith("/src/starlight/tests.rs") | not))
              | .summary.lines]
            | {covered: (map(.covered) | add // 0), total: (map(.count) | add // 0)}
            | if .total == 0 then error("No instrumented starlight production lines found")
              else . + {percent: (100 * .covered / .total)}
              end
            | "Starlight production line coverage: \(.covered)/\(.total) (\(.percent)%)",
              (if .percent >= 90 then true else error("Starlight coverage is below 90%") end)
          ' phase-coverage.json
