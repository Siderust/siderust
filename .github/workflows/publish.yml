name: Publish to crates.io

on:
  push:
    tags:
      - "v[0-9]*"
  pull_request:
    paths:
      - ".github/workflows/publish.yml"
      - "scripts/publish-changed.sh"
      - "tools/release/**"
      - "Cargo.toml"
      - "siderust-ffi/Cargo.toml"
      - "Cargo.lock"
      - "CHANGELOG.md"
  workflow_dispatch:

concurrency:
  # One publication attempt per tag/ref; never cancel an in-flight publish.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Release tool unit tests
        run: cargo test -p siderust-release

      - name: Build release tool
        run: cargo build -p siderust-release

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          BIN=target/debug/siderust-release
          if [[ -n "${RELEASE_TAG}" ]]; then
            "$BIN" validate --tag "${RELEASE_TAG}" --require-tag
          else
            "$BIN" validate
          fi

      - name: Check docs.rs documentation before publishing
        env:
          SIDERUST_JPL_STUB: all
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::invalid_html_tags"
        run: cargo doc -p siderust --all-features --no-deps

      - name: Dry-run publishable package
        run: bash scripts/publish-changed.sh --dry-run

  publish:
    name: cargo publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: crates.io
      url: https://crates.io/crates/siderust
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release tool
        run: cargo build -p siderust-release

      - name: Re-validate tag, versions, and changelog
        run: target/debug/siderust-release validate --tag "${{ github.ref_name }}" --require-tag

      # Publish changed publishable packages.
      # siderust-ffi has publish = false and is skipped automatically.
      # Pass --confirm-ffi and protect behind a manual environment for FFI releases.
      - name: Publish changed packages
        run: bash scripts/publish-changed.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release tool
        run: cargo build -p siderust-release

      - name: Extract changelog notes
        run: |
          set -euo pipefail
          target/debug/siderust-release extract-changelog \
            --tag "${{ github.ref_name }}" \
            -o "${{ runner.temp }}/release-notes.md"
          test -s "${{ runner.temp }}/release-notes.md"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          TITLE="Siderust v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Updating existing release ${TAG}"
            gh release edit "${TAG}" --title "${TITLE}" --notes-file "${NOTES}"
          else
            echo "Creating release ${TAG}"
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --notes-file "${NOTES}" \
              --verify-tag
          fi
