[package]
name = "siderust-ffi"
version = "0.12.0"
edition = "2021"
authors = ["VPRamon <vallespuigramon@gmail.com>"]
description = "C FFI bindings for siderust, high-precision astronomy library."
license = "AGPL-3.0-only"
repository = "https://github.com/Siderust/siderust"
publish    = false

[lib]
name = "siderust_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
serde = ["siderust/serde"]
runtime-data = ["siderust/runtime-data", "dep:siderust-archive", "siderust-archive/fetch"]


[dependencies]
siderust    = { version = "0.12.0", path = "..", default-features = false, features = ["std"] }
siderust-archive = { version = "0.1.5", optional = true, default-features = false, features = ["jpl", "std"] }
keplerian   = { version = "0.3", default-features = false, features = ["std", "alloc"] }
principia   = { version = "0.3", git = "https://github.com/Siderust/principia", branch = "feature/no-std-affn-0.10", default-features = false, features = ["alloc", "std"] }
qtty        = { version = "0.8", default-features = false, features = ["std", "alloc"] }
tempoch     = { version = "0.7", default-features = false, features = ["std", "alloc"] }
# tempoch-ffi 0.7 is tagged upstream but not yet on crates.io; 0.6.6 is ABI-compatible
# for the `TempochPeriodMjd` re-export used by the generated C header.
tempoch-ffi = "0.6.6"
affn        = { version = "0.10", default-features = false, features = ["astro", "std", "alloc"] }
serde_json  = { version = "1.0", optional = true }
tokio       = { version = "1.39", features = ["rt"], optional = true }

[build-dependencies]
cbindgen = "0.29.2"

[dev-dependencies]
chrono     = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "allow"
missing_docs = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
