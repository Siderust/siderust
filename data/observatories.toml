# Canonical Siderust observatory catalog.
#
# Add custom catalogs using this same [[observatory]] record representation.
# Longitude and latitude are WGS84 geodetic degrees, height is WGS84
# ellipsoidal metres, pressure is hPa, temperature is K, and relative
# humidity is a dimensionless fraction in [0, 1].

[[observatory]]
# Coordinates/height: ESO Paranal site documentation.
# Pressure: established Siderust/NSB reference value for Cerro Paranal.
name = "El Paranal Observatory"
longitude_deg = -70.4043
latitude_deg = -24.6272
height_m = 2635.0
reference_pressure_hpa = 744.0

