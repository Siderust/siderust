[package]
name = "siderust-release"
version = "0.1.0"
edition = "2021"
publish = false
description = "Internal release validation and changelog helpers for Siderust."
license = "AGPL-3.0-only"

[lib]
name = "siderust_release"
path = "src/lib.rs"

[[bin]]
name = "siderust-release"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "allow"

[lints.rustdoc]
broken_intra_doc_links = "deny"
