[workspace]
members = [
    ".",
    "siderust-ffi",
]

[workspace.lints.rust]
unsafe_code     = "forbid"
missing_docs    = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all           = { level = "deny", priority = -1 }
todo          = "deny"
unimplemented = "deny"
dbg_macro     = "deny"
print_stdout  = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[package]
name = "siderust"
version = "0.12.0"
edition = "2021"
authors = ["VPRamon <vallespuigramon@gmail.com>"]
description = "High-precision astronomy and satellite mechanics in Rust."
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/Siderust/siderust"
homepage = "https://github.com/Siderust/siderust"
keywords = ["astronomy", "satellite", "orbital-mechanics", "vsop87", "no-std"]
categories = ["science", "aerospace", "simulation", "no-std"]

[lib]
name = "siderust"

[[example]]
name = "16_lambert_earth_to_mars"
path = "examples/16_lambert_earth_to_mars.rs"
required-features = ["pod"]

[[example]]
name = "17_sgp4_from_tle"
path = "examples/17_sgp4_from_tle.rs"
required-features = ["pod"]

[[example]]
name = "18_lisa_pod"
path = "examples/18_lisa_pod.rs"
required-features = ["pod"]

[[test]]
name = "pod_smoke"
path = "tests/pod_smoke.rs"
required-features = ["pod"]

[[test]]
name = "tle_sgp4_pipeline"
path = "tests/tle_sgp4_pipeline.rs"
required-features = ["pod"]

[[test]]
name = "spice_context"
path = "tests/spice_context.rs"
required-features = ["spice"]

[features]
default = ["std", "serde"]
## Enable the Rust standard library (filesystem, OS I/O, `Utc::now`, etc.).
## Without `std`, the crate builds as `no_std` + `alloc`.
std = [
    "qtty/std",
    "affn/std",
    "tempoch/std",
    "keplerian/std",
    "optica/std",
    "principia/std",
    "cheby/std",
    "siderust-archive/std",
    "chrono/std",
    "chrono/clock",
    "dep:quick-xml",
    "serde?/std",
    "serde_json?/std",
    "toml?/std",
    "thiserror/std",
    "wide/std",
]
lagrange-centers = ["serde", "siderust-archive/lagrange"]
## Runtime dataset download/cache via `siderust-archive`. Requires `std`.
runtime-data = ["std", "siderust-archive/fetch"]
serde = [
    "dep:serde",
    "dep:serde_json",
    "dep:toml",
    "qtty/serde",
    "affn/serde",
    "tempoch/serde",
    "keplerian/serde",
    "optica/serde",
]
photometry = []
## SPICE kernel context. Path-based loading requires `std`.
spice = ["std"]
atmosphere = []
doris = []
## Precise Orbit Determination (POD) toolkit. Folded from the former `siderust-pod` crate.
## Requires `std` (faer linalg, filesystem product writers).
pod = ["std", "serde", "dep:faer", "dep:hex", "dep:sha2"]
## Parquet residuals writer in the `pod::product` module.
pod-parquet = ["pod", "dep:parquet"]
## DORIS RINEX observation parser inside `pod::io`.
pod-doris = ["pod", "doris"]
## Internal baseline helpers for Criterion benchmarks (not part of the stable API).
bench-internals = []

[dependencies]
# Alloc is always enabled: siderust is an orchestration crate built around Vec/String.
affn = { version = "0.10", default-features = false, features = ["astro", "alloc"] }
cheby = { version = "0.4.1", git = "https://github.com/Siderust/cheby", branch = "fix/no-std-float-alloc", default-features = false, features = ["alloc", "approx", "calculus"] }
keplerian = { version = "0.3", default-features = false, features = ["alloc"] }
optica = { version = "0.3", default-features = false, features = ["alloc"] }
principia = { version = "0.3", git = "https://github.com/Siderust/principia", branch = "feature/no-std-affn-0.10", default-features = false, features = ["alloc"] }
qtty = { version = "0.8", default-features = false, features = ["alloc", "astro", "density", "frequency", "radiometry", "satellite"] }
tempoch = { version = "0.7", default-features = false, features = ["alloc"] }
siderust-archive = { version = "0.1.5", default-features = false, features = ["jpl", "vsop", "elp", "nutation", "gravity", "atmosphere", "pluto", "time"] }

thiserror = { version = "2", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
paste = "1.0"
quick-xml = { version = "0.41", default-features = false, optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"], optional = true }
serde_json = { version = "1.0", default-features = false, features = ["alloc"], optional = true }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "display"], optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
wide = { version = "1.7", default-features = false }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }
spin = { version = "0.10", default-features = false, features = ["once"] }

# POD toolkit dependencies (gated on the `pod` feature family)
faer = { version = "0.24", default-features = false, features = ["std", "linalg"], optional = true }
hex = { version = "0.4", optional = true }
parquet = { version = "59", default-features = false, optional = true }

[dev-dependencies]
approx = "0.5"
rstest = "0.26"
criterion = "0.8"
serde_json = "1.0"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "display"] }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }
spin = { version = "0.10", default-features = false, features = ["once"] }

[[test]]
name = "test_event_search"
path = "tests/test_event_search.rs"
required-features = ["bench-internals"]

[[bench]]
name = "converters"
harness = false

[[bench]]
name = "vsop87"
harness = false

[[bench]]
name = "solar_altitude"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "moon_altitude"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "star_altitude"
harness = false

[[bench]]
name = "elp2000"
harness = false

[[bench]]
name = "ephemeris_comparison"
harness = false

[[bench]]
name = "altitude_comparison"
harness = false

[[bench]]
name = "de441"
harness = false

[[bench]]
name = "spk_perf"
harness = false

[[bench]]
name = "sidereal"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
